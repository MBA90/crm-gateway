spring:
  application:
    name: crm-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: customer-service
              uri: http://localhost:8201
              predicates:
                - Path=/services/customer/**
              filters:
                - StripPrefix=2
  security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: http://localhost:8180/realms/crm-realm
server:
  port: 8100